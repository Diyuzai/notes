<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>页面不存在 · 学习笔记</title>
<!--
  注意：这个页面要放在仓库根目录才会生效（全站共用一份）。
  下面的 /notes/ 假定你的仓库名叫 notes；换成别的名字就改成 /你的仓库名/
-->
<style>
  :root { --bg:#f6f8fa; --fg:#1f2328; --muted:#59636e; --border:#d8dee4; --accent:#0969da; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0d1117; --fg:#e6edf3; --muted:#9198a1; --border:#3d444d; --accent:#4493f8; }
  }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--fg); text-align: center; padding: 24px;
    font: 16px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI",
          "Microsoft YaHei", "PingFang SC", sans-serif;
  }
  .code { font-size: 64px; font-weight: 700; letter-spacing: -2px; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 24px; }
  a {
    display: inline-block; padding: 9px 22px; border-radius: 999px;
    border: 1px solid var(--border); color: var(--accent);
    text-decoration: none; font-size: 14px;
  }
  a:hover { border-color: var(--accent); }
</style>
</head>
<body>
  <div>
    <p class="code">404</p>
    <p>这个页面不存在，可能已经被移动或删除了。</p>
    <a href="/notes/">返回学习笔记首页</a>
  </div>
</body>
</html>
